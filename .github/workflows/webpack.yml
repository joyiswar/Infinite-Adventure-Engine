# Advanced CI/CD Pipeline for Infinite Adventure Engine

name: CI/CD Pipeline

on:
  push:
    branches: ["main", "staging", "develop"]
  pull_request:
    branches: ["main", "staging"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: 'npm'
          
      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Lint
        run: npx eslint src
        
      - name: Build
        run: npm run build

      # Placeholder for future tests (Sprint 1)
      - name: Test
        run: echo "Skipping tests - implemented in Sprint 1"

  deploy-production:
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy
        run: echo "Deployment managed via Render Auto-Deploy on Main branch."
