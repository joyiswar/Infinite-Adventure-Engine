<main class="min-h-screen flex flex-col lg:flex-row bg-[#0B0D11] overflow-hidden text-slate-200">

  <!-- MOBILE TOP BAR (Only visible on Mobile/Tablet) -->
  <header class="lg:hidden h-16 flex items-center justify-between px-6 bg-slate-900/90 backdrop-blur-md border-b border-amber-500/20 z-[70] shadow-xl">
    <div class="flex items-center gap-3">
      <span class="material-symbols-outlined text-amber-500 text-xl">terminal</span>
      <h1 class="text-[10px] font-black uppercase tracking-[0.3em] text-amber-500">Aether Engine</h1>
    </div>
    <button (click)="toggleSidebar()" class="w-10 h-10 flex items-center justify-center rounded-lg border border-amber-500/30 bg-amber-500/5 text-amber-500 active:scale-90 transition-transform">
      <span class="material-symbols-outlined">{{ isSidebarOpen() ? 'close' : 'menu' }}</span>
    </button>
  </header>

  <!-- SIDEBAR DRAWER -->
  <aside
    [class.translate-x-0]="isSidebarOpen()"
    [class.-translate-x-full]="!isSidebarOpen()"
    class="fixed inset-y-0 left-0 z-[80] w-[85%] max-w-xs transition-transform duration-500 cubic-bezier(0.4, 0, 0.2, 1) lg:relative lg:translate-x-0 lg:z-40 lg:w-80 shadow-2xl lg:shadow-none"
  >
    <app-sidebar
      [inventory]="inventory()"
      [quest]="quest()"
      [achievements]="unlockedAchievements()"
      [newAchievement]="newAchievementUnlocked()"
      [lastUnlockedId]="lastUnlockedAchievementId()"
      [codex]="codex()"
      [newCodexEntry]="newCodexEntryAdded()"
      [lastAddedCodexTitle]="lastAddedCodexTitle()"
      (itemDetail)="onItemDetail($event)"
      [characterPortraitUrl]="characterPortraitUrl()"
    >
    </app-sidebar>
  </aside>

  <!-- MOBILE OVERLAY -->
  @if (isSidebarOpen()) {
    <div
      (click)="toggleSidebar()"
      class="lg:hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-[75] animate-in fade-in duration-300"
    ></div>
  }

  <!-- MAIN VIEWPORT AREA -->
  <div class="flex-grow flex flex-col relative overflow-hidden">
    <div class="flex-1 relative overflow-hidden">
      <app-adventure
        (gameStateChange)="onGameStateChange()"
        (portraitChange)="onPortraitChange()"
        (toggleSidebar)="toggleSidebar()"
      ></app-adventure>
    </div>
  </div>

  <!-- GLOBAL NOTIFICATION LAYER (Fixed at top right) -->
  @if (toast().show) {
    <div class="fixed top-20 right-4 lg:top-8 lg:right-8 z-[100] bg-slate-900/95 backdrop-blur-2xl border border-amber-500/40 p-4 rounded-xl shadow-[0_20px_60px_rgba(0,0,0,0.8)] toast-animate max-w-[calc(100vw-2rem)] sm:max-w-sm overflow-hidden">
      <div class="absolute top-0 left-0 w-1 h-full bg-amber-500"></div>
      <div class="flex items-start gap-4">
        <div class="w-10 h-10 rounded-full bg-amber-500/10 flex items-center justify-center border border-amber-500/30">
          <span class="material-symbols-outlined text-amber-500 text-xl">verified</span>
        </div>
        <div class="flex-1">
          <h3 class="text-[10px] font-black uppercase tracking-[0.2em] text-amber-400">{{ toast().title }}</h3>
          <p class="text-xs text-slate-300 leading-snug mt-1 font-medium">{{ toast().message }}</p>
        </div>
        <button (click)="toast.set({title:'', message:'', show:false})" class="text-slate-500 hover:text-white">
          <span class="material-symbols-outlined text-sm">close</span>
        </button>
      </div>
    </div>
  }
</main>
