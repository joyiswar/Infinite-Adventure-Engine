<main class="min-h-screen flex flex-col lg:flex-row bg-[#0F1115] overflow-hidden">

  <!-- Sidebar (Mobile Overlay / Desktop Fixed) -->
  <aside
    [class.translate-x-0]="isSidebarOpen()"
    [class.-translate-x-full]="!isSidebarOpen()"
    class="fixed inset-y-0 left-0 z-[60] w-80 transition-transform duration-300 ease-in-out lg:relative lg:translate-x-0 lg:z-40"
  >
    <app-sidebar
      [inventory]="inventory()"
      [quest]="quest()"
      [achievements]="unlockedAchievements()"
      [newAchievement]="newAchievementUnlocked()"
      [lastUnlockedId]="lastUnlockedAchievementId()"
      [codex]="codex()"
      [newCodexEntry]="newCodexEntryAdded()"
      [lastAddedCodexTitle]="lastAddedCodexTitle()"
      [characterPortraitUrl]="characterPortraitUrl()"
    >
    </app-sidebar>

    <!-- Mobile Close Overlay -->
    @if (isSidebarOpen()) {
      <button
        (click)="toggleSidebar()"
        class="lg:hidden fixed inset-0 bg-black/60 backdrop-blur-sm -z-10 w-screen h-screen left-80"
      ></button>
    }
  </aside>

  <!-- Main HUD Area -->
  <div class="flex-grow overflow-hidden relative">
    <app-adventure
      (gameStateChange)="onGameStateChange($event)"
      (portraitChange)="onPortraitChange($event)"
      (toggleSidebar)="toggleSidebar()"
    ></app-adventure>
  </div>

  <!-- Global Toast -->
  @if (toast().show) {
    <div class="fixed top-20 right-4 z-[100] bg-slate-900/90 backdrop-blur-xl border border-amber-500/50 p-4 rounded-xl shadow-2xl toast-animate max-w-xs">
      <div class="flex items-start gap-3">
        <span class="material-symbols-outlined text-amber-500" data-icon="verified">verified</span>
        <div>
          <h3 class="text-[10px] font-bold uppercase tracking-widest text-amber-400">{{ toast().title }}</h3>
          <p class="text-xs text-slate-300 leading-tight mt-1">{{ toast().message }}</p>
        </div>
      </div>
    </div>
  }
</main>
