<main class="min-h-screen flex flex-col md:flex-row bg-slate-900 overflow-hidden">
  <!-- Mobile Header -->
  <header class="md:hidden p-4 flex justify-between items-center border-b border-slate-800 bg-slate-900 z-30">
    <h1 class="text-2xl font-bold font-serif-story text-amber-300">{{ title }}</h1>
    <button (click)="toggleSidebar()" class="p-2 text-amber-300 focus:outline-none">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7" />
      </svg>
    </button>
  </header>

  <!-- Main Content Area -->
  <div class="flex-grow overflow-y-auto p-4 md:p-8 md:w-2/3 lg:w-3/4">
    <app-adventure
      (gameStateChange)="onGameStateChange($event)"
      (portraitChange)="onPortraitChange($event)"
    ></app-adventure>
  </div>

  <!-- Sidebar (Desktop and Mobile Drawer) -->
  <aside
    [class.translate-x-0]="isSidebarOpen()"
    [class.translate-x-full]="!isSidebarOpen()"
    class="fixed inset-0 z-40 md:relative md:translate-x-0 md:w-1/3 lg:w-1/4 transition-transform duration-300 ease-in-out bg-slate-900 md:bg-transparent"
  >
    <div class="h-full overflow-y-auto p-4 md:p-0 md:pl-6 md:border-l md:border-slate-800">
      <div class="md:hidden flex justify-end mb-4">
        <button (click)="toggleSidebar()" class="p-2 text-slate-400">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
      <app-sidebar
        [inventory]="inventory()"
        [quest]="quest()"
        [achievements]="unlockedAchievements()"
        [newAchievement]="newAchievementUnlocked()"
        [lastUnlockedId]="lastUnlockedAchievementId()"
        [codex]="codex()"
        [newCodexEntry]="newCodexEntryAdded()"
        [lastAddedCodexTitle]="lastAddedCodexTitle()"
        [characterPortraitUrl]="characterPortraitUrl()"
      >
      </app-sidebar>
    </div>
  </aside>
</main>

<!-- Toast Notification -->
@if (toast().show) {
  <div class="fixed bottom-4 left-4 right-4 md:left-auto md:right-8 md:bottom-8 bg-slate-800 border-2 border-amber-400 text-slate-100 rounded-lg shadow-2xl p-4 md:w-80 z-50 toast-animate">
    <div class="flex items-start gap-4">
      <div class="text-amber-300">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" />
        </svg>
      </div>
      <div>
        <h3 class="font-bold text-amber-300 font-serif-story text-lg">{{ toast().title }}</h3>
        <p class="text-slate-300">{{ toast().message }}</p>
      </div>
    </div>
  </div>
}
