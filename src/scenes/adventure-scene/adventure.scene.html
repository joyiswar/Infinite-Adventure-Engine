<div class="relative min-h-screen flex flex-col">
  <!-- 3D Rendering Layer -->
  <div #canvasContainer class="fixed inset-0 pointer-events-none opacity-20 z-0"></div>

  <div class="relative z-10 flex-grow p-4 md:p-8">
    <!-- Existing UI elements ... -->
    <div class="max-w-4xl mx-auto space-y-8">
      @if (gameState()) {
        <section class="bg-slate-800/50 backdrop-blur-md border border-slate-700 rounded-2xl overflow-hidden shadow-2xl">
          <!-- Image Section -->
          <div class="relative aspect-video bg-slate-900 flex items-center justify-center">
            @if (isLoading()) {
              <div class="absolute inset-0 z-20 flex flex-col items-center justify-center bg-slate-900/80">
                <div class="w-16 h-16 border-4 border-amber-400 border-t-transparent rounded-full animate-spin"></div>
                <p class="mt-4 text-amber-300 font-serif-story text-xl italic">{{ loadingMessage() }}</p>
              </div>
            }

            @if (currentImage()) {
              <img [src]="currentImage()" alt="Scene" class="w-full h-full object-cover">
            } @else {
              <div class="text-slate-500 italic">The scene is manifesting...</div>
            }
          </div>

          <!-- Story Section -->
          <div class="p-6 md:p-8 space-y-6">
            <div class="prose prose-invert max-w-none">
              <p class="text-xl md:text-2xl font-serif-story leading-relaxed text-slate-100">
                {{ gameState()?.story }}
              </p>
            </div>

            <!-- Choices Section -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 pt-4">
              @for (choice of gameState()?.choices; track choice.id) {
                <button
                  (click)="handleChoice(choice)"
                  [disabled]="isLoading()"
                  class="p-4 text-left border-2 border-slate-600 rounded-xl hover:border-amber-400 hover:bg-amber-400/10 transition-all duration-200 group relative"
                >
                  <span class="absolute left-2 top-2 text-xs text-slate-500 group-hover:text-amber-300">#{{ choice.id }}</span>
                  <span class="block mt-2 font-medium">{{ choice.text }}</span>
                </button>
              }
            </div>
          </div>
        </section>
      } @else {
         <div class="flex items-center justify-center h-64">
           <div class="w-16 h-16 border-4 border-amber-400 border-t-transparent rounded-full animate-spin"></div>
         </div>
      }
    </div>
  </div>
</div>
